<style>
:root{color-scheme:dark;--bg:#080e19;--panel:#101a2a;--panel2:#162338;--text:#f3f6fc;--muted:#93a4bb;--line:#25344b;--accent:#69e0b0;--blue:#82aaff;--danger:#ff8d91}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#12233a 0,#080e19 48%);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:850px;margin:auto;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 16px}.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#8bf2c5,#58a9ff);display:grid;place-items:center;color:#06111c;font-weight:900;font-size:20px}.brand h1{font-size:18px;letter-spacing:1.6px;margin:0}.sub{font-size:11px;color:var(--muted);letter-spacing:1.5px}.iconbtn,.smallbtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px}.headline{display:flex;justify-content:space-between;align-items:end;margin:10px 0 14px}.headline h2{margin:0;font-size:27px;letter-spacing:-.5px}.headline p{color:var(--muted);margin:4px 0 0;font-size:12px}.updated{font-size:11px;color:var(--muted);text-align:right}.sports,.dates,.filters{display:flex;gap:8px;overflow:auto;padding:3px 0 12px;scrollbar-width:none}.pill{white-space:nowrap;border:1px solid var(--line);background:#0e1726;color:var(--muted);padding:9px 14px;border-radius:12px;font-size:13px}.pill.active{background:var(--accent);color:#062015;border-color:var(--accent);font-weight:800}.datepill{min-width:75px;text-align:center}.datepill strong{display:block;font-size:14px;color:var(--text)}.datepill.active strong{color:#062015}.datepill span{font-size:11px}.controls{display:flex;gap:8px;align-items:center;margin:2px 0 14px}.search{min-width:0;flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;color:var(--text);padding:11px 12px}.select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 8px;max-width:125px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:12px 2px}.sectionhead h3{margin:0;font-size:15px}.count{font-size:12px;color:var(--muted)}.match{border:1px solid var(--line);background:linear-gradient(135deg,rgba(20,33,52,.98),rgba(13,22,36,.98));border-radius:17px;padding:14px;margin-bottom:10px;box-shadow:0 8px 20px #00000015}.matchtop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.league{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.5px}.status{font-size:10px;border-radius:6px;padding:4px 7px;background:#26364c;color:#d8e2f0;font-weight:800}.status.live{background:#3a242e;color:#ff9ea6}.status.live:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff6777;margin-right:5px}.teams{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:8px}.team{text-align:center;min-width:0}.team img{width:36px;height:36px;object-fit:contain;margin-bottom:6px}.teamname{font-size:13px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}.score{font-size:25px;font-weight:900;letter-spacing:1px;text-align:center;font-variant-numeric:tabular-nums}.score small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:0}.matchfoot{border-top:1px solid var(--line);margin-top:13px;padding-top:10px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.fav{border:0;background:transparent;color:#74849c;font-size:20px;padding:0 3px}.fav.on{color:#ffd66e}.empty,.error{padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);background:#0d1624}.empty b,.error b{display:block;color:var(--text);margin-bottom:6px}.loading{padding:25px;text-align:center;color:var(--muted)}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#0b1220ed;border-top:1px solid var(--line);backdrop-filter:blur(18px);display:flex;justify-content:center}.nav{display:flex;width:min(100%,600px);justify-content:space-around}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:55px;padding:4px}.nav button span{font-size:19px}.nav button.active{color:var(--accent)}.notice{font-size:11px;color:var(--muted);padding:12px 4px;text-align:center}.source{color:var(--muted);font-size:10px;text-align:center;padding:8px}.source a{color:var(--blue)}.modalback{position:fixed;inset:0;z-index:10;background:#02050bd9;display:none;align-items:end;justify-content:center}.modalback.show{display:flex}.modal{width:min(100%,700px);max-height:90vh;overflow:auto;background:#101a2a;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}.modalhead{display:flex;justify-content:space-between;align-items:center}.modal h2{font-size:18px;margin:0}.tabs{display:flex;gap:8px;margin:18px 0}.tab{flex:1;padding:9px 4px;border:1px solid var(--line);background:#0b1422;border-radius:10px;color:var(--muted)}.tab.active{color:var(--accent);border-color:var(--accent)}.detail-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:20px 0}.detail-score .big{font-size:36px;font-weight:900}.detail-score .teamname{font-size:14px}.detail-content{color:#dce5f3;font-size:13px;white-space:pre-wrap}.settings{padding:16px 0}.settings button{margin:5px 5px 5px 0}.light{--bg:#f2f5fa;--panel:#fff;--panel2:#e8eef6;--text:#152033;--muted:#62718a;--line:#d5deea;background:linear-gradient(#e6eef8,#f4f6fa);color:var(--text);color-scheme:light}.light .match{background:#fff}.light .pill,.light .bottom,.light .modal{background:#fff}.light .pill.active{background:var(--accent)}@media(min-width:600px){.app{padding-left:22px;padding-right:22px}.modalback{align-items:center}.modal{border-radius:24px}.match{padding:17px}.team img{width:42px;height:42px}}
</style></head>
<body><main class="app" id="app">
<header class="top"><div class="brand"><div class="logo">S</div><div><h1>SPORTS LIVE</h1><div class="sub">SCORES · FIXTURES · LIVE</div></div></div><button class="iconbtn" id="themeBtn" aria-label="テーマ切り替え">☼</button></header>
<div class="headline"><div><h2 id="pageTitle">試合速報</h2><p id="todayText">実際の試合データを取得します</p></div><div class="updated" id="updated">未取得<br>—</div></div>
<div class="sports" id="sports"><button class="pill active" data-sport="all">すべて</button><button class="pill" data-sport="baseball">⚾ 野球</button><button class="pill" data-sport="basketball">🏀 バスケ</button><button class="pill" data-sport="soccer">⚽ サッカー</button></div>
<div class="dates" id="dates"><button class="pill datepill" data-day="-1"><span>昨日</span><strong>—</strong></button><button class="pill datepill active" data-day="0"><span>今日</span><strong>—</strong></button><button class="pill datepill" data-day="1"><span>明日</span><strong>—</strong></button><input type="date" class="select" id="customDate" aria-label="日付選択"></div>
<div class="controls"><input class="search" id="search" placeholder="チーム・リーグを検索" aria-label="検索"><button class="smallbtn" id="refresh">↻</button></div>
<div class="filters" id="filters"><button class="pill active" data-filter="all">すべての試合</button><button class="pill" data-filter="live">LIVE</button><button class="pill" data-filter="pre">試合前</button><button class="pill" data-filter="post">終了</button><button class="pill" data-filter="fav">★ お気に入り</button></div>
<div class="sectionhead"><h3 id="listTitle">本日の試合</h3><span class="count" id="count">—</span></div><div id="matches"><div class="loading">実データに接続中…</div></div>
<div class="source" id="sourceNote">データ提供元は各試合カードに表示します。</div><div class="notice" id="notice">スコア更新はデータ提供元の更新頻度に依存します。</div>
</main>
<nav class="bottom"><div class="nav"><button class="active" data-page="home"><span>⌂</span>ホーム</button><button data-page="live"><span>◉</span>ライブ</button><button data-page="favorites"><span>☆</span>お気に入り</button><button data-page="search"><span>⌕</span>検索</button><button data-page="settings"><span>⚙</span>設定</button></div></nav>
<div class="modalback" id="modalback"><section class="modal"><div class="modalhead"><h2 id="modalTitle">試合詳細</h2><button class="iconbtn" id="closeModal">✕</button></div><div id="modalBody"></div></section></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const leagues=[
 {sport:'baseball',league:'MLB',name:'MLB',path:'baseball/mlb'},
 {sport:'basketball',league:'NBA',name:'NBA',path:'basketball/nba'},
 {sport:'soccer',league:'eng.1',name:'プレミアリーグ',path:'soccer/eng.1'},
 {sport:'soccer',league:'esp.1',name:'ラ・リーガ',path:'soccer/esp.1'},
 {sport:'soccer',league:'ita.1',name:'セリエA',path:'soccer/ita.1'},
 {sport:'soccer',league:'ger.1',name:'ブンデスリーガ',path:'soccer/ger.1'},
 {sport:'soccer',league:'uefa.champions',name:'UEFA Champions League',path:'soccer/uefa.champions'}
];
let state={sport:'all',day:0,date:localDate(0),filter:'all',page:'home',matches:[],errors:[],loading:false,lastUpdated:null,theme:localStorage.getItem('sl-theme')||'dark',detail:null,detailTab:'game'};
const favRead=()=>{try{return JSON.parse(localStorage.getItem('sl-favs')||'[]')}catch{return[]}};let favorites=favRead();
function localDate(offset){let d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatDate(d){return new Date(d+'T12:00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'})}
function fmtTime(d){if(!d)return '開始時刻不明';return new Date(d).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}
function statusInfo(e){const s=e.status||e.competitions?.[0]?.status||{},type=s.type||{},state=type.state||'';let label=type.shortDetail||type.detail||type.description||'';if(!label)label=state==='in'?'試合中':state==='post'?'試合終了':state==='pre'?'試合前':'状況不明';let kind=state==='in'?'live':state==='post'?'post':state==='pre'?'pre':'unknown';return{kind,label,period:s.period||null,clock:s.displayClock||null}}
function mapEvent(e,l){const c=e.competitions?.[0]||{}, competitors=c.competitors||[];const home=competitors.find(x=>x.homeAway==='home')||competitors[0]||{},away=competitors.find(x=>x.homeAway==='away')||competitors[1]||{};const st=statusInfo(e);return{id:`espn-${l.league}-${e.id}`,eventId:e.id,sport:l.sport,league:l.name,leagueId:l.league,source:'ESPN',date:e.date||c.date||null,home:{name:home.team?.displayName||home.team?.name||'チーム名なし',logo:home.team?.logo||null,score:home.score??null,id:home.team?.id},away:{name:away.team?.displayName||away.team?.name||'チーム名なし',logo:away.team?.logo||null,score:away.score??null,id:away.team?.id},status:st,detailUrl:`https://site.api.espn.com/apis/site/v2/sports/${l.path}/summary?event=${encodeURIComponent(e.id)}`,raw:e}}
async function fetchLeague(l){const date=state.date.replaceAll('-','');const url=`https://site.api.espn.com/apis/site/v2/sports/${l.path}/scoreboard?dates=${date}`;const r=await fetch(url,{headers:{'Accept':'application/json'},cache:'no-store'});if(!r.ok)throw new Error(`${l.name}: HTTP ${r.status}`);const data=await r.json();if(!data||!Array.isArray(data.events))throw new Error(`${l.name}: 想定外のレスポンス`);return data.events.map(e=>mapEvent(e,l))}
async function load(){if(state.loading)return;state.loading=true;$('#refresh').textContent='…';$('#matches').innerHTML='<div class="loading">実データを取得中…</div>';state.errors=[];renderTop();const target=leagues.filter(l=>state.sport==='all'||l.sport===state.sport);const results=await Promise.allSettled(target.map(fetchLeague));let list=[];results.forEach((r,i)=>{if(r.status==='fulfilled')list.push(...r.value);else state.errors.push(r.reason?.message||`${target[i].name}: データを取得できません`)});state.matches=list.sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));state.lastUpdated=new Date();state.loading=false;$('#refresh').textContent='↻';render();}
function visibleMatches(){let q=$('#search').value.trim().toLowerCase();return state.matches.filter(m=>{if(state.filter==='live'&&m.status.kind!=='live')return false;if(state.filter==='pre'&&m.status.kind!=='pre')return false;if(state.filter==='post'&&m.status.kind!=='post')return false;if(state.filter==='fav'&&!favorites.includes(m.id))return false;if(state.page==='live'&&m.status.kind!=='live')return false;if(state.page==='favorites'&&!favorites.includes(m.id))return false;if(q&&!`${m.home.name} ${m.away.name} ${m.league}`.toLowerCase().includes(q))return false;return true})}
function renderTop(){$('#todayText').textContent=formatDate(state.date)+' · 実データ';$('#updated').innerHTML=state.lastUpdated?`更新 ${state.lastUpdated.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`:'未取得<br>—';$('#pageTitle').textContent=({home:'試合速報',live:'ライブ中',favorites:'お気に入り',search:'試合を検索',settings:'設定'})[state.page]||'試合速報';$('#listTitle').textContent=state.page==='favorites'?'お気に入りの試合':state.page==='live'?'ライブ中の試合':formatDate(state.date)+' の試合'}
function scoreText(m){if(m.home.score==null&&m.away.score==null)return '—';return `${m.away.score??'—'} - ${m.home.score??'—'}`}
function card(m){const isFav=favorites.includes(m.id);const st=m.status;const meta=st.kind==='live'?[st.period?`第${st.period}${m.sport==='baseball'?'回':m.sport==='basketball'?'Q':''}`:'試合中',st.clock].filter(Boolean).join(' · '):st.kind==='pre'?fmtTime(m.date):st.label;return `<article class="match" data-id="${esc(m.id)}"><div class="matchtop"><span class="league">${esc(m.league)} · ${esc(m.source)}</span><span class="status ${st.kind==='live'?'live':''}">${esc(st.label||'状況不明')}</span></div><div class="teams"><div class="team">${m.away.logo?`<img loading="lazy" src="${esc(m.away.logo)}" alt="" onerror="this.style.display='none'">`:''}<div class="teamname">${esc(m.away.name)}</div></div><div class="score">${esc(scoreText(m))}<small>${esc(st.kind==='pre'?'VS':meta)}</small></div><div class="team">${m.home.logo?`<img loading="lazy" src="${esc(m.home.logo)}" alt="" onerror="this.style.display='none'">`:''}<div class="teamname">${esc(m.home.name)}</div></div></div><div class="matchfoot"><span>${esc(fmtTime(m.date))} · タップで詳細</span><button class="fav ${isFav?'on':''}" data-fav="${esc(m.id)}" aria-label="お気に入り">${isFav?'★':'☆'}</button></div></article>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){renderTop();const list=visibleMatches();$('#count').textContent=`${list.length} 試合`;if(state.page==='settings'){renderSettings();return}if(list.length)$('#matches').innerHTML=list.map(card).join('');else if(state.errors.length&&!state.matches.length)$('#matches').innerHTML=`<div class="error"><b>データを取得できません</b>${esc(state.errors.join(' / '))}<br><br>接続先や一時的な障害を確認し、時間をおいて再試行してください。</div>`;else $('#matches').innerHTML=`<div class="empty"><b>${state.filter==='fav'||state.page==='favorites'?'お気に入りの試合はありません':'該当する試合はありません'}</b>${state.matches.length?'条件を変更してお試しください。':'この日付にデータ提供元が返した試合はありません。'}</div>`;$('#sourceNote').innerHTML='データ提供元: ESPN scoreboard API · <a href="https://www.espn.com/" target="_blank" rel="noopener">ESPN</a>';$('#notice').textContent=state.errors.length?`一部データソースで取得エラー: ${state.errors.join(' / ')}`:'試合がない場合、架空の試合は表示しません。';}
function renderSettings(){$('#matches').innerHTML=`<div class="match settings"><h3>表示設定</h3><p>テーマ: ${state.theme==='dark'?'ダーク':'ライト'}</p><button class="pill" id="toggleTheme">テーマを切り替え</button><p>自動更新: 60秒間隔（画面表示中のみ）</p><p>お気に入り: この端末のブラウザに保存</p><p>対応データソース: ESPN Scoreboard API</p><p>取得対象: MLB / NBA / プレミアリーグ / ラ・リーガ / セリエA / ブンデスリーガ / UEFA Champions League</p><p>未検証・未対応: NPB、Bリーグ、Jリーグ。現在のデータ接続先では安定した対応を確認できていないため、架空データで補いません。</p><p>詳細の一部スタッツやラインナップは試合ごとの提供状況に依存します。</p></div>`;$('#toggleTheme').onclick=toggleTheme;}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('sl-theme',state.theme);document.body.classList.toggle('light',state.theme==='light');render()}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('sl-favs',JSON.stringify(favorites));render()}
async function openDetail(id){const m=state.matches.find(x=>x.id===id);if(!m)return;state.detail=m;state.detailTab='game';$('#modalTitle').textContent=`${m.away.name} vs ${m.home.name}`;$('#modalBody').innerHTML='<div class="loading">試合詳細を取得中…</div>';$('#modalback').classList.add('show');try{const r=await fetch(m.detailUrl,{cache:'no-store'});if(!r.ok)throw new Error('詳細データを取得できません');const data=await r.json();m.summary=data;renderDetail()}catch(e){$('#modalBody').innerHTML=`<div class="error"><b>詳細データを取得できません</b>試合一覧に表示されている情報のみ利用できます。</div>`}}
function renderDetail(){const m=state.detail,d=m.summary||{},comp=d.header?.competitions?.[0]||{},teams=comp.competitors||[],home=teams.find(t=>t.homeAway==='home'),away=teams.find(t=>t.homeAway==='away');const tabs=[['game','試合'],['events','経過'],['stats','スタッツ'],['lineup','ラインナップ']];let content='';if(state.detailTab==='game'){content=`<p>${esc(m.league)} · ${esc(m.status.label)} · ${esc(fmtTime(m.date))}</p><p>データ取得元: ESPN</p><p>最終更新: ${state.lastUpdated?.toLocaleString('ja-JP')||'—'}</p>`;if(d.boxscore?.players?.length)content+='<p>選手スタッツは「スタッツ」タブを確認してください。</p>'}else if(state.detailTab==='events'){const plays=d.plays?.[0]?.plays||d.commentary||[];content=plays.length?plays.slice(-30).reverse().map(p=>`${esc(p.clock?.displayValue||p.period?.displayValue||'')} ${esc(p.text||p.shortText||'')}`).join('\n'):'この試合の経過データは提供されていません。'}else if(state.detailTab==='stats'){const box=d.boxscore?.teams||[];content=box.length?box.map(t=>`${t.team?.displayName||'チーム'}\n${(t.statistics||[]).map(s=>`${s.label||s.name}: ${s.displayValue||s.value}`).join('\n')}`).join('\n\n'):'この試合のスタッツは提供されていません。'}else{const players=d.boxscore?.players||[];content=players.length?players.map(t=>`${t.team?.displayName||'チーム'}\n${(t.statistics||[]).flatMap(s=>s.athletes||[]).map(a=>a.athlete?.displayName||'').filter(Boolean).join('、')}`).join('\n\n'):'ラインナップは提供されていません。'}$('#modalBody').innerHTML=`<div class="detail-score"><div><div class="teamname">${esc(away?.team?.displayName||m.away.name)}</div><div class="big">${esc(away?.score??m.away.score??'—')}</div></div><div>—</div><div><div class="teamname">${esc(home?.team?.displayName||m.home.name)}</div><div class="big">${esc(home?.score??m.home.score??'—')}</div></div></div><div class="tabs">${tabs.map(([id,label])=>`<button class="tab ${state.detailTab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</div><div class="detail-content">${content}</div><p class="source">データ提供元: ESPN · 最終取得 ${new Date().toLocaleTimeString('ja-JP')}</p>`;$$('[data-tab]').forEach(b=>b.onclick=()=>{state.detailTab=b.dataset.tab;renderDetail()})}
