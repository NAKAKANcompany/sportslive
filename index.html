<body><main class="app" id="app">
<header class="top"><div class="brand"><div class="logo">S</div><div><h1>SPORTS LIVE</h1><div class="sub">SCORES · FIXTURES · LIVE</div></div></div><button class="iconbtn" id="themeBtn" aria-label="テーマ切り替え">☼</button></header>
<div class="headline"><div><h2 id="pageTitle">試合速報</h2><p id="todayText">実際の試合データを取得します</p></div><div class="updated" id="updated">未取得<br>—</div></div>
<div class="sports" id="sports"><button class="pill active" data-sport="all">すべて</button><button class="pill" data-sport="baseball">⚾ 野球</button><button class="pill" data-sport="basketball">🏀 バスケ</button><button class="pill" data-sport="soccer">⚽ サッカー</button></div>
<div class="dates" id="dates"><button class="pill datepill" data-day="-1"><span>昨日</span><strong>—</strong></button><button class="pill datepill active" data-day="0"><span>今日</span><strong>—</strong></button><button class="pill datepill" data-day="1"><span>明日</span><strong>—</strong></button><input type="date" class="select" id="customDate" aria-label="日付選択"></div>
<div class="controls"><input class="search" id="search" placeholder="チーム・リーグを検索" aria-label="検索"><button class="smallbtn" id="refresh">↻</button></div>
<div class="filters" id="filters"><button class="pill active" data-filter="all">すべての試合</button><button class="pill" data-filter="live">LIVE</button><button class="pill" data-filter="pre">試合前</button><button class="pill" data-filter="post">終了</button><button class="pill" data-filter="fav">★ お気に入り</button></div>
<div class="sectionhead"><h3 id="listTitle">本日の試合</h3><span class="count" id="count">—</span></div><div id="matches"><div class="loading">実データに接続中…</div></div><div id="officialFallback"></div>
<div class="source" id="sourceNote">データ提供元は各試合カードに表示します。</div><div class="notice" id="notice">スコア更新はデータ提供元の更新頻度に依存します。</div>
</main>
<nav class="bottom"><div class="nav"><button class="active" data-page="home"><span>⌂</span>ホーム</button><button data-page="live"><span>◉</span>ライブ</button><button data-page="favorites"><span>☆</span>お気に入り</button><button data-page="search"><span>⌕</span>検索</button><button data-page="settings"><span>⚙</span>設定</button></div></nav>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

 {sport:'soccer',league:'ger.1',name:'ブンデスリーガ',path:'soccer/ger.1'},

 {sport:'soccer',league:'usa.1',name:'MLS',path:'soccer/usa.1'},
 {sport:'soccer',league:'mex.1',name:'リーガMX',path:'soccer/mex.1'},
 {sport:'soccer',league:'bra.1',name:'ブラジル全国選手権',path:'soccer/bra.1'},
 {sport:'soccer',league:'arg.1',name:'アルゼンチンリーグ',path:'soccer/arg.1'},

 {sport:'soccer',league:'uefa.europa',name:'UEFA Europa League',path:'soccer/uefa.europa'},
 {sport:'soccer',league:'uefa.europa.conf',name:'UEFA Conference League',path:'soccer/uefa.europa.conf'},
 {sport:'soccer',league:'fifa.world',name:'FIFA World Cup',path:'soccer/fifa.world'},
 {sport:'soccer',league:'usa.nwsl',name:'NWSL',path:'soccer/usa.nwsl'},
 {sport:'soccer',league:'ksa.1',name:'サウジ・プロリーグ',path:'soccer/ksa.1'},
 {sport:'soccer',league:'aus.1',name:'オーストラリア Aリーグ',path:'soccer/aus.1'}
];
const sportsDbNames={baseball:'Baseball',basketball:'Basketball',soccer:'Soccer'};
const sourceHealth={espn:'未確認',sportsdb:'未確認',npb:'未確認',bleague:'未確認'};
let state={sport:'all',day:0,date:localDate(0),filter:'all',page:'home',matches:[],errors:[],loading:false,lastUpdated:null,theme:localStorage.getItem('sl-theme')||'dark',detail:null,detailTab:'game'};
const favRead=()=>{try{return JSON.parse(localStorage.getItem('sl-favs')||'[]')}catch{return[]}};let favorites=favRead();
function localDate(offset){let d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatDate(d){return new Date(d+'T12:00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'})}
function fmtTime(d){if(!d)return '開始時刻不明';return new Date(d).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}
function statusInfo(e){const s=e.status||e.competitions?.[0]?.status||{},type=s.type||{},state=type.state||'';let label=type.shortDetail||type.detail||type.description||'';if(!label)label=state==='in'?'試合中':state==='post'?'試合終了':state==='pre'?'試合前':'状況不明';let kind=state==='in'?'live':state==='post'?'post':state==='pre'?'pre':'unknown';return{kind,label,period:s.period||null,clock:s.displayClock||null}}
function mapEvent(e,l){const c=e.competitions?.[0]||{}, competitors=c.competitors||[];const home=competitors.find(x=>x.homeAway==='home')||competitors[0]||{},away=competitors.find(x=>x.homeAway==='away')||competitors[1]||{};const st=statusInfo(e);return{id:`espn-${l.league}-${e.id}`,eventId:e.id,sport:l.sport,league:l.name,leagueId:l.league,source:'ESPN',date:e.date||c.date||null,home:{name:home.team?.displayName||home.team?.name||'チーム名なし',logo:home.team?.logo||null,score:home.score??null,id:home.team?.id},away:{name:away.team?.displayName||away.team?.name||'チーム名なし',logo:away.team?.logo||null,score:away.score??null,id:away.team?.id},status:st,detailUrl:`https://site.api.espn.com/apis/site/v2/sports/${l.path}/summary?event=${encodeURIComponent(e.id)}`,raw:e}}
async function fetchLeague(l){const date=state.date.replaceAll('-','');const url=`https://site.api.espn.com/apis/site/v2/sports/${l.path}/scoreboard?dates=${date}`;const r=await fetch(url,{headers:{'Accept':'application/json'},cache:'no-store'});if(!r.ok)throw new Error(`${l.name}: HTTP ${r.status}`);const data=await r.json();if(!data||!Array.isArray(data.events))throw new Error(`${l.name}: 想定外のレスポンス`);sourceHealth.espn='接続成功';return data.events.map(e=>mapEvent(e,l))}
function mapSportsDbEvent(e,sport){const status=String(e.strStatus||'').toLowerCase();if(/live|in progress|in-play|half time|halftime|1st half|2nd half|period [1-9]/i.test(status))return null;const finished=/finished|match finished|full time|\bft\b|final|after extra time|after penalties/i.test(status);const date=e.dateEvent?`${e.dateEvent}T${(e.strTime||'12:00:00').slice(0,8)}`:null;const homeScore=e.intHomeScore==null||e.intHomeScore===''?null:Number(e.intHomeScore);const awayScore=e.intAwayScore==null||e.intAwayScore===''?null:Number(e.intAwayScore);return{id:`sportsdb-${sport}-${e.idEvent||`${e.dateEvent||''}-${e.strHomeTeam||''}-${e.strAwayTeam||''}`}`,eventId:e.idEvent||null,sport,league:e.strLeague||'リーグ不明',leagueId:e.idLeague||'',source:'TheSportsDB（補助データ）',date,home:{name:e.strHomeTeam||'チーム名不明',logo:e.strHomeTeamBadge||null,score:Number.isFinite(homeScore)?homeScore:null,id:e.idHomeTeam||null},away:{name:e.strAwayTeam||'チーム名不明',logo:e.strAwayTeamBadge||null,score:Number.isFinite(awayScore)?awayScore:null,id:e.idAwayTeam||null},status:finished?{kind:'post',label:'試合終了（補助データ）'}:{kind:'pre',label:'予定・状態未確認'},detailUrl:null,raw:e}}
async function fetchSportsDb(sport){const date=state.date;const label=sportsDbNames[sport];if(!label)return[];const url=`https://www.thesportsdb.com/api/v1/json/123/eventsday.php?d=${encodeURIComponent(date)}&s=${encodeURIComponent(label)}`;const r=await fetch(url,{headers:{'Accept':'application/json'},cache:'no-store'});if(!r.ok)throw new Error(`TheSportsDB ${label}: HTTP ${r.status}`);const data=await r.json();if(!data||!Array.isArray(data.events)){sourceHealth.sportsdb='接続成功（該当データなし）';return[]}sourceHealth.sportsdb='接続成功';return data.events.map(e=>mapSportsDbEvent(e,sport)).filter(Boolean)}
// League-specific fallback: TheSportsDB has dedicated NPB and Japanese B1 league records. This is schedule/result data, not a guaranteed live feed.
async function fetchLeagueSeason(leagueId,season,sport,healthKey,displayName){const url=`https://www.thesportsdb.com/api/v1/json/123/eventsseason.php?id=${encodeURIComponent(leagueId)}&s=${encodeURIComponent(season)}`;const r=await fetch(url,{headers:{'Accept':'application/json'},cache:'no-store'});if(!r.ok)throw new Error(`${displayName} TheSportsDB: HTTP ${r.status}`);const data=await r.json();if(!data||!Array.isArray(data.events)){sourceHealth[healthKey]='接続成功（データなし）';return[]}const events=data.events.filter(e=>String(e.dateEvent||'').slice(0,10)===state.date).map(e=>mapSportsDbEvent(e,sport)).filter(Boolean);sourceHealth[healthKey]=events.length?'接続成功（対象日の試合あり）':'接続成功（対象日の試合なし）';return events}
async function fetchJapanLeagueFallbacks(){const tasks=[];if(state.sport==='all'||state.sport==='baseball')tasks.push(fetchLeagueSeason('4591','2026','baseball','npb','NPB'));else sourceHealth.npb='未取得（競技フィルター外）';if(state.sport==='all'||state.sport==='basketball')tasks.push(fetchLeagueSeason('4977','2025-2026','basketball','bleague','B.LEAGUE'));else sourceHealth.bleague='未取得（競技フィルター外）';return (await Promise.allSettled(tasks)).flatMap((r)=>{if(r.status==='fulfilled')return r.value;state.errors.push(r.reason?.message||'国内リーグの補助データ取得に失敗');return[]})}
function eventKey(m){const norm=x=>String(x||'').toLowerCase().normalize('NFKD').replace(/[^\p{L}\p{N}]/gu,'');const day=m.date?String(m.date).slice(0,10):'';const a=norm(m.home.name),b=norm(m.away.name);return`${m.sport}|${day}|${[a,b].sort().join('|')}`}
async function limitedMap(items,limit,fn){const out=new Array(items.length);let next=0;const workers=Array.from({length:Math.min(limit,items.length)},async()=>{while(next<items.length){const i=next++;try{out[i]={status:'fulfilled',value:await fn(items[i])}}catch(reason){out[i]={status:'rejected',reason}}}});await Promise.all(workers);return out}
async function load(){if(state.loading)return;state.loading=true;$('#refresh').textContent='…';$('#matches').innerHTML='<div class="loading">複数の実データ提供元を確認中…</div>';state.errors=[];sourceHealth.espn='取得中';sourceHealth.sportsdb='取得中';renderTop();const target=leagues.filter(l=>state.sport==='all'||l.sport===state.sport);const results=await limitedMap(target,5,fetchLeague);let list=[];results.forEach((r,i)=>{if(r.status==='fulfilled')list.push(...r.value);else state.errors.push(r.reason?.message||`${target[i].name}: データを取得できません`)});if(results.length&&results.every(r=>r.status==='rejected'))sourceHealth.espn='接続失敗';const sports=state.sport==='all'?['baseball','basketball','soccer']:[state.sport];const secondary=await Promise.allSettled(sports.map(fetchSportsDb));secondary.forEach((r,i)=>{if(r.status==='fulfilled')list.push(...r.value);else state.errors.push(r.reason?.message||`${sports[i]}: 補助データを取得できません`)});const domestic=await fetchJapanLeagueFallbacks();list.push(...domestic);const seen=new Set();state.matches=list.filter(m=>{const k=eventKey(m);if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));state.lastUpdated=new Date();state.loading=false;$('#refresh').textContent='↻';render();}
function visibleMatches(){let q=$('#search').value.trim().toLowerCase();return state.matches.filter(m=>{if(state.filter==='live'&&m.status.kind!=='live')return false;if(state.filter==='pre'&&m.status.kind!=='pre')return false;if(state.filter==='post'&&m.status.kind!=='post')return false;if(state.filter==='fav'&&!favorites.includes(m.id))return false;if(state.page==='live'&&m.status.kind!=='live')return false;if(state.page==='favorites'&&!favorites.includes(m.id))return false;if(q&&!`${m.home.name} ${m.away.name} ${m.league}`.toLowerCase().includes(q))return false;return true})}
function renderTop(){$('#todayText').textContent=formatDate(state.date)+' · 実データ';$('#updated').innerHTML=state.lastUpdated?`更新 ${state.lastUpdated.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`:'未取得<br>—';$('#pageTitle').textContent=({home:'試合速報',live:'ライブ中',favorites:'お気に入り',search:'試合を検索',settings:'設定'})[state.page]||'試合速報';$('#listTitle').textContent=state.page==='favorites'?'お気に入りの試合':state.page==='live'?'ライブ中の試合':formatDate(state.date)+' の試合'}
function scoreText(m){if(m.home.score==null&&m.away.score==null)return '—';return `${m.away.score??'—'} - ${m.home.score??'—'}`}
function card(m){const isFav=favorites.includes(m.id);const st=m.status;const meta=st.kind==='live'?[st.period?`第${st.period}${m.sport==='baseball'?'回':m.sport==='basketball'?'Q':''}`:'試合中',st.clock].filter(Boolean).join(' · '):st.kind==='pre'?fmtTime(m.date):st.label;return `<article class="match" data-id="${esc(m.id)}"><div class="matchtop"><span class="league">${esc(m.league)} · ${esc(m.source)}</span><span class="status ${st.kind==='live'?'live':''}">${esc(st.label||'状況不明')}</span></div><div class="teams"><div class="team">${m.away.logo?`<img loading="lazy" src="${esc(m.away.logo)}" alt="" onerror="this.style.display='none'">`:''}<div class="teamname">${esc(m.away.name)}</div></div><div class="score">${esc(scoreText(m))}<small>${esc(st.kind==='pre'?'VS':meta)}</small></div><div class="team">${m.home.logo?`<img loading="lazy" src="${esc(m.home.logo)}" alt="" onerror="this.style.display='none'">`:''}<div class="teamname">${esc(m.home.name)}</div></div></div><div class="matchfoot"><span>${esc(fmtTime(m.date))} · タップで詳細</span><button class="fav ${isFav?'on':''}" data-fav="${esc(m.id)}" aria-label="お気に入り">${isFav?'★':'☆'}</button></div></article>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function officialFallbackHTML(){
 if(state.page==='settings')return '';
 const items=[];
 if(state.sport==='all'||state.sport==='baseball'){items.push({title:'NPB 公式 試合速報',desc:'プロ野球の公式速報・日程・結果',url:'https://npb.jp/games/'});items.push({title:'NPB 公式 日程・結果',desc:'月別の対戦カード・試合結果を確認',url:'https://npb.jp/games/2026/'});}
 if(state.sport==='all'||state.sport==='basketball'){items.push({title:'B.LEAGUE 公式 日程・結果',desc:'B.PREMIER・B.ONE等の公式日程・結果',url:'https://www.bleague.jp/schedule/'});items.push({title:'B.LEAGUE 公式 年間スケジュール',desc:'リーグ戦やカップ戦の年間日程',url:'https://www.bleague.jp/schedule/?tab=1&year=2026'});}
 if(state.sport==='all'||state.sport==='soccer')items.push({title:'Jリーグ 公式 試合日程・結果',desc:'Jリーグの公式試合情報を確認',url:'https://www.jleague.jp/match/'});
 if(!items.length)return '';
 return `<section class="official-wrap"><h3>国内リーグの公式スコア・日程</h3><p>このアプリ内で自動取得できない場合も、公式ページを直接開いて確認できます。公式サイトの表示内容を無断転載せず、リンク先で最新情報を確認してください。</p><div class="official-links">${items.map(x=>`<a class="official-link" href="${x.url}" target="_blank" rel="noopener noreferrer"><span><strong>${x.title}</strong><small>${x.desc}</small></span><span class="arrow">↗</span></a>`).join('')}</div></section>`;
}
function render(){renderTop();const list=visibleMatches();$('#count').textContent=`${list.length} 試合`;if(state.page==='settings'){renderSettings();$('#officialFallback').innerHTML='';return}if(list.length)$('#matches').innerHTML=list.map(card).join('');else if(state.errors.length&&!state.matches.length)$('#matches').innerHTML=`<div class="error"><b>データを取得できません</b>${esc(state.errors.join(' / '))}<br><br>接続先や一時的な障害を確認し、時間をおいて再試行してください。</div>`;else $('#matches').innerHTML=`<div class="empty"><b>${state.filter==='fav'||state.page==='favorites'?'お気に入りの試合はありません':'該当する試合はありません'}</b>${state.matches.length?'条件を変更してお試しください。':'この日付にデータ提供元が返した試合はありません。'}</div>`;$('#officialFallback').innerHTML=officialFallbackHTML();$('#sourceNote').innerHTML='データ提供元: <a href="https://www.espn.com/" target="_blank" rel="noopener">ESPN</a> / <a href="https://www.thesportsdb.com/" target="_blank" rel="noopener">TheSportsDB</a>（補助データ。国内リーグは公式リンクも併設）';$('#notice').textContent=state.errors.length?`一部データソースで取得エラー: ${state.errors.join(' / ')}`:'試合がない場合、架空の試合は表示しません。';}
function renderSettings(){$('#matches').innerHTML=`<div class="match settings"><h3>表示設定・データ取得状況</h3><p>テーマ: ${state.theme==='dark'?'ダーク':'ライト'}</p><button class="pill" id="toggleTheme">テーマを切り替え</button><p>自動更新: 60秒間隔（画面表示中のみ）</p><p>お気に入り: この端末のブラウザに保存</p><hr><p><b>取得先の状態</b></p><p>ESPN scoreboard: ${esc(sourceHealth.espn)}</p><p>TheSportsDB Free（競技別）: ${esc(sourceHealth.sportsdb)}（補助的な日程・結果）</p><p>NPB専用シーズン取得: ${esc(sourceHealth.npb)}（TheSportsDB league ID 4591 / 2026シーズン）</p><p>B.LEAGUE専用シーズン取得: ${esc(sourceHealth.bleague)}（TheSportsDB league ID 4977 / season label 2025-2026。現行シーズンとの一致は要確認）</p><p><b>対象リーグ</b></p><p>野球: MLB、NCAA Baseball、World Baseball Classic</p><p>バスケ: NBA、WNBA、NCAA男女、NBA G League、NBL、FIBA</p><p>サッカー: イングランド2部を含む欧州主要リーグ、MLS、リーガMX、ブラジル、アルゼンチン、Jリーグ候補、UEFA大会、サウジ、オーストラリアなど</p><p><b>まだ十分にカバーできていないもの</b></p><p>NPB・B.LEAGUEはTheSportsDBのリーグ別シーズンデータも追加で取得し、選択日の試合だけを表示するよう試みます。無料APIの応答・対象シーズン・ライブ更新は保証されないため、公式ページのリンクも併設しています。</p><p>ESPNの公開APIは正式な開発者向けSLAを確認できていません。データ量や表示内容は提供元・日程・無料枠に左右されます。取得できないデータを架空データで補いません。</p><p>一部の詳細スタッツやラインナップは試合ごとの提供状況に依存します。</p></div>`;$('#toggleTheme').onclick=toggleTheme;}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('sl-theme',state.theme);document.body.classList.toggle('light',state.theme==='light');render()}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('sl-favs',JSON.stringify(favorites));render()}
async function openDetail(id){const m=state.matches.find(x=>x.id===id);if(!m)return;state.detail=m;state.detailTab='game';$('#modalTitle').textContent=`${m.away.name} vs ${m.home.name}`;$('#modalback').classList.add('show');if(!m.detailUrl){$('#modalBody').innerHTML=`<div class="detail-score"><div><div class="teamname">${esc(m.away.name)}</div><div class="big">${esc(m.away.score??'—')}</div></div><div>—</div><div><div class="teamname">${esc(m.home.name)}</div><div class="big">${esc(m.home.score??'—')}</div></div></div><div class="detail-content"><p>${esc(m.league)} · ${esc(m.status.label)}</p><p>日時: ${esc(m.date||'不明')}</p><p>取得元: TheSportsDBの無料補助データ</p><p>この取得先では詳細経過・スタッツ・ライブ状況を保証しません。</p></div><p class="source"><a href="https://www.thesportsdb.com/" target="_blank" rel="noopener">TheSportsDB</a></p>`;return}$('#modalBody').innerHTML='<div class="loading">試合詳細を取得中…</div>';try{const r=await fetch(m.detailUrl,{cache:'no-store'});if(!r.ok)throw new Error('詳細データを取得できません');const data=await r.json();m.summary=data;renderDetail()}catch(e){$('#modalBody').innerHTML=`<div class="error"><b>詳細データを取得できません</b>試合一覧に表示されている情報のみ利用できます。</div>`}}
function renderDetail(){const m=state.detail,d=m.summary||{},comp=d.header?.competitions?.[0]||{},teams=comp.competitors||[],home=teams.find(t=>t.homeAway==='home'),away=teams.find(t=>t.homeAway==='away');const tabs=[['game','試合'],['events','経過'],['stats','スタッツ'],['lineup','ラインナップ']];let content='';if(state.detailTab==='game'){content=`<p>${esc(m.league)} · ${esc(m.status.label)} · ${esc(fmtTime(m.date))}</p><p>データ取得元: ESPN</p><p>最終更新: ${state.lastUpdated?.toLocaleString('ja-JP')||'—'}</p>`;if(d.boxscore?.players?.length)content+='<p>選手スタッツは「スタッツ」タブを確認してください。</p>'}else if(state.detailTab==='events'){const plays=d.plays?.[0]?.plays||d.commentary||[];content=plays.length?plays.slice(-30).reverse().map(p=>`${esc(p.clock?.displayValue||p.period?.displayValue||'')} ${esc(p.text||p.shortText||'')}`).join('\n'):'この試合の経過データは提供されていません。'}else if(state.detailTab==='stats'){const box=d.boxscore?.teams||[];content=box.length?box.map(t=>`${t.team?.displayName||'チーム'}\n${(t.statistics||[]).map(s=>`${s.label||s.name}: ${s.displayValue||s.value}`).join('\n')}`).join('\n\n'):'この試合のスタッツは提供されていません。'}else{const players=d.boxscore?.players||[];content=players.length?players.map(t=>`${t.team?.displayName||'チーム'}\n${(t.statistics||[]).flatMap(s=>s.athletes||[]).map(a=>a.athlete?.displayName||'').filter(Boolean).join('、')}`).join('\n\n'):'ラインナップは提供されていません。'}$('#modalBody').innerHTML=`<div class="detail-score"><div><div class="teamname">${esc(away?.team?.displayName||m.away.name)}</div><div class="big">${esc(away?.score??m.away.score??'—')}</div></div><div>—</div><div><div class="teamname">${esc(home?.team?.displayName||m.home.name)}</div><div class="big">${esc(home?.score??m.home.score??'—')}</div></div></div><div class="tabs">${tabs.map(([id,label])=>`<button class="tab ${state.detailTab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</div><div class="detail-content">${content}</div><p class="source">データ提供元: ESPN · 最終取得 ${new Date().toLocaleTimeString('ja-JP')}</p>`;$$('[data-tab]').forEach(b=>b.onclick=()=>{state.detailTab=b.dataset.tab;renderDetail()})}
$$('#sports .pill').forEach(b=>b.addEventListener('click',()=>{state.sport=b.dataset.sport;$$('#sports .pill').forEach(x=>x.classList.toggle('active',x===b));load()}));
$$('#dates [data-day]').forEach(b=>{const d=Number(b.dataset.day);b.querySelector('strong').textContent=localDate(d).slice(5).replace('-','/');b.addEventListener('click',()=>{state.day=d;state.date=localDate(d);$('#customDate').value='';$$('#dates [data-day]').forEach(x=>x.classList.toggle('active',x===b));load()})});$('#customDate').value=state.date;$('#customDate').addEventListener('change',e=>{if(e.target.value){state.date=e.target.value;state.day=null;$$('#dates [data-day]').forEach(x=>x.classList.remove('active'));load()}});
$$('#filters .pill').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;$$('#filters .pill').forEach(x=>x.classList.toggle('active',x===b));render()}));$('#search').addEventListener('input',()=>render());$('#refresh').onclick=load;$('#themeBtn').onclick=toggleTheme;$('#closeModal').onclick=()=>$('#modalback').classList.remove('show');$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')$('#modalback').classList.remove('show')});
$('#matches').addEventListener('click',e=>{const fav=e.target.closest('[data-fav]');if(fav){e.stopPropagation();toggleFav(fav.dataset.fav);return}const article=e.target.closest('[data-id]');if(article)openDetail(article.dataset.id)});
$$('.nav button').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;$$('.nav button').forEach(x=>x.classList.toggle('active',x===b));if(state.page==='search')$('#search').focus();render()}));
document.body.classList.toggle('light',state.theme==='light');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});load();setInterval(()=>{if(!document.hidden&&state.page!=='settings')load()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-(state.lastUpdated?.getTime()||0)>60000)load()});
</script></body></html>
