<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><title>SPORTS LIVE</title>
<style>
:root{color-scheme:dark;--bg:#080e19;--panel:#101a2a;--text:#f3f6fc;--muted:#93a4bb;--line:#25344b;--accent:#69e0b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:850px;margin:auto;padding:16px 14px 50px}.top,.head,.matchtop,.foot,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.top{padding:8px 0 18px}.brand{font-weight:900;letter-spacing:1px;font-size:19px}.muted,.sub,.meta{color:var(--muted);font-size:12px}.head h1{margin:0;font-size:26px}.pills{display:flex;gap:8px;overflow:auto;padding:12px 0;scrollbar-width:none}.pill,button,input,select{font:inherit}.pill,button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 12px;white-space:nowrap}.pill.active{background:var(--accent);color:#082016;border-color:var(--accent);font-weight:800}.controls{display:flex;gap:8px}.controls input{flex:1;min-width:0}.controls input,select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:10px}.section{display:flex;justify-content:space-between;margin:18px 2px 10px}.section h2{font-size:15px;margin:0}.match{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.league{font-size:11px;color:var(--muted)}.status{font-size:11px;padding:4px 7px;border-radius:6px;background:#26364c}.status.live{color:#ff9da6;background:#42232e}.teams{display:grid;grid-template-columns:1fr 62px 1fr;gap:6px;align-items:center;margin:14px 0}.team{text-align:center;font-weight:700;font-size:13px;overflow-wrap:anywhere}.team img{display:block;width:36px;height:36px;object-fit:contain;margin:0 auto 6px}.score{text-align:center;font-size:24px;font-weight:900}.score small{display:block;color:var(--muted);font-size:10px;font-weight:400}.foot{border-top:1px solid var(--line);padding-top:9px;color:var(--muted);font-size:11px}.fav{padding:0;border:0;background:transparent;color:#ffd66e;font-size:20px}.empty,.error,.loading{padding:24px 14px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);white-space:normal}.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.links a{color:#9dc4ff;text-decoration:none;border:1px solid var(--line);padding:8px;border-radius:9px;font-size:12px}.modalback{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:end;justify-content:center}.modalback.show{display:flex}.modal{width:min(100%,700px);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 14px 28px}.tabs{display:flex;gap:6px;overflow:auto;margin:15px 0}.tab.active{color:var(--accent);border-color:var(--accent)}.content{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.warning{font-size:11px;color:var(--muted);text-align:center;margin:18px 0}.light{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--text:#182338;--muted:#61718a;--line:#d5deea}.light body{background:var(--bg)}@media(min-width:600px){.app{padding:22px}.modalback{align-items:center}.modal{border-radius:22px}}
</style></head><body><main class="app">
<header class="top"><div><div class="brand">◈ SPORTS LIVE</div><div class="sub">実データ・無料データ取得版</div></div><button id="theme">テーマ</button></header>
<div class="head"><div><h1 id="pageTitle">試合速報</h1><div class="muted" id="dateLabel">日付を読み込み中</div></div><div class="muted" id="updated">未更新</div></div>
<div class="pills" id="sports"><button class="pill active" data-sport="all">すべて</button><button class="pill" data-sport="baseball">⚾ 野球</button><button class="pill" data-sport="basketball">🏀 バスケ</button><button class="pill" data-sport="soccer">⚽ サッカー</button></div>
<div class="pills" id="days"><button class="pill" data-day="-1">昨日</button><button class="pill active" data-day="0">今日</button><button class="pill" data-day="1">明日</button><input type="date" id="customDate"></div>
<div class="controls"><input id="search" placeholder="チーム・リーグを検索"><button id="refresh">更新 ↻</button></div>
<div class="pills" id="filters"><button class="pill active" data-filter="all">すべて</button><button class="pill" data-filter="live">試合中</button><button class="pill" data-filter="pre">試合前</button><button class="pill" data-filter="post">終了</button><button class="pill" data-filter="fav">★ お気に入り</button></div>
<div class="section"><h2 id="listTitle">試合一覧</h2><span class="muted" id="count">—</span></div><div id="matches"><div class="loading">実データに接続中…</div></div>
<div class="warning" id="warning">取得できない試合・スコアは推測で作成しません。無料データ提供元の収録範囲には限りがあります。</div>
</main><div class="modalback" id="back"><section class="modal"><div class="row"><b id="modalTitle">試合詳細</b><button id="close">閉じる ✕</button></div><div id="modalBody"></div></section></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const MLB_IDS=new Set([119,112,135,121,111,108,141,117,145]);
const MLB_JA={'Los Angeles Dodgers':'ロサンゼルス・ドジャース','LA Dodgers':'ロサンゼルス・ドジャース','Dodgers':'ロサンゼルス・ドジャース','Chicago Cubs':'シカゴ・カブス','Cubs':'シカゴ・カブス','San Diego Padres':'サンディエゴ・パドレス','Padres':'サンディエゴ・パドレス','New York Mets':'ニューヨーク・メッツ','Mets':'ニューヨーク・メッツ','Boston Red Sox':'ボストン・レッドソックス','Red Sox':'ボストン・レッドソックス','Los Angeles Angels':'ロサンゼルス・エンゼルス','LA Angels':'ロサンゼルス・エンゼルス','Angels':'ロサンゼルス・エンゼルス','Toronto Blue Jays':'トロント・ブルージェイズ','Blue Jays':'トロント・ブルージェイズ','Houston Astros':'ヒューストン・アストロズ','Astros':'ヒューストン・アストロズ','Chicago White Sox':'シカゴ・ホワイトソックス','White Sox':'シカゴ・ホワイトソックス'};
const NPB=[['読売ジャイアンツ','Yomiuri Giants','Giants'],['阪神タイガース','Hanshin Tigers','Tigers'],['横浜DeNAベイスターズ','Yokohama DeNA BayStars','DeNA BayStars'],['広島東洋カープ','Hiroshima Toyo Carp','Carp'],['東京ヤクルトスワローズ','Tokyo Yakult Swallows','Yakult Swallows'],['中日ドラゴンズ','Chunichi Dragons','Dragons'],['福岡ソフトバンクホークス','Fukuoka SoftBank Hawks','SoftBank Hawks'],['北海道日本ハムファイターズ','Hokkaido Nippon-Ham Fighters','Nippon-Ham Fighters'],['千葉ロッテマリーンズ','Chiba Lotte Marines','Lotte Marines'],['東北楽天ゴールデンイーグルス','Tohoku Rakuten Golden Eagles','Rakuten Eagles'],['オリックス・バファローズ','Orix Buffaloes','Orix Buffaloes'],['埼玉西武ライオンズ','Saitama Seibu Lions','Seibu Lions']];
const JP_PLAYERS=['Shohei Ohtani','Yoshinobu Yamamoto','Roki Sasaki','Seiya Suzuki','Shota Imanaga','Masataka Yoshida','Kodai Senga','Yusei Kikuchi','Yuki Matsui','Yu Darvish','Kenta Maeda'];
const leagues=[{sport:'baseball',league:'MLB',name:'MLB（指定9球団）',path:'baseball/mlb'},{sport:'baseball',league:'NPB',name:'NPB 日本プロ野球',tsdb:'Baseball'},{sport:'basketball',league:'B.LEAGUE',name:'B.LEAGUE',tsdb:'Basketball'},{sport:'basketball',league:'NBA',name:'NBA',path:'basketball/nba'},{sport:'soccer',league:'eng.1',name:'プレミアリーグ',path:'soccer/eng.1'},{sport:'soccer',league:'esp.1',name:'ラ・リーガ',path:'soccer/esp.1'},{sport:'soccer',league:'ita.1',name:'セリエA',path:'soccer/ita.1'},{sport:'soccer',league:'ger.1',name:'ブンデスリーガ',path:'soccer/ger.1'},{sport:'soccer',league:'uefa.champions',name:'UEFAチャンピオンズリーグ',path:'soccer/uefa.champions'}];
const official=[['NPB公式 日程・結果','https://npb.jp/games/'],['B.LEAGUE公式 日程・結果','https://www.bleague.jp/schedule/'],['MLB公式 日程','https://www.mlb.com/schedule/team-by-team']];
const state={sport:'all',date:day(0),filter:'all',matches:[],errors:[],sources:[],last:null,loading:false,detail:null,tab:'game',page:'home'};
let favs=[];try{favs=JSON.parse(localStorage.getItem('sportslive-favs')||'[]')}catch{}
function day(n){const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function key(x){return String(x||'').toLowerCase().normalize('NFKC').replace(/[^a-z0-9ぁ-んァ-ヶ一-龠]/g,'')}
function teamJA(n,league){const raw=String(n||'');if(league==='MLB'){for(const [en,ja] of Object.entries(MLB_JA))if(raw.toLowerCase()===en.toLowerCase())return ja}if(league==='NPB'){const k=key(raw);for(const t of NPB)if(t.some(x=>k.includes(key(x))||key(x).includes(k)))return t[0]}return raw||'チーム名未確認'}
function time(d,unknown=false){if(unknown||!d||String(d).endsWith('T00:00:00Z'))return '時刻未発表';const n=new Date(d);return Number.isNaN(n.getTime())?'時刻未確認':n.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}
function status(raw,state){const s=String(raw||'');if(/postponed/i.test(s))return ['延期','unknown'];if(/cancelled|canceled/i.test(s))return ['中止','unknown'];if(state==='in'||/live|in progress|playing/i.test(s))return ['試合中','live'];if(state==='post'||/final|finished|match finished/i.test(s))return ['試合終了','post'];if(state==='pre'||/scheduled|not started|pre-game/i.test(s))return ['試合前','pre'];return [s||'状況不明','unknown']}
async function json(url,label){const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw Error(`${label} HTTP ${r.status}`);return r.json()}
function mapESPN(e,l){const c=e.competitions?.[0]||{},ts=c.competitors||[],h=ts.find(x=>x.homeAway==='home')||ts[0]||{},a=ts.find(x=>x.homeAway==='away')||ts[1]||{},s=e.status||c.status||{},t=s.type||{},st=status(t.shortDetail||t.detail||t.description,t.state);return{id:`espn-${l.league}-${e.id}`,eventId:e.id,sport:l.sport,league:l.name,leagueId:l.league,source:'ESPN',date:e.date||c.date,home:{name:teamJA(h.team?.displayName||h.team?.name,l.league),logo:h.team?.logo,score:h.score??null},away:{name:teamJA(a.team?.displayName||a.team?.name,l.league),logo:a.team?.logo,score:a.score??null},status:{label:st[0],kind:st[1],period:s.period,clock:s.displayClock},detailUrl:`https://site.api.espn.com/apis/site/v2/sports/${l.path}/summary?event=${encodeURIComponent(e.id)}`}}
function focusedMLB(e){return(e.competitions?.[0]?.competitors||[]).some(x=>MLB_IDS.has(Number(x.team?.id))||['LAD','CHC','SD','NYM','BOS','LAA','TOR','HOU','CWS'].includes(String(x.team?.abbreviation||'').toUpperCase()))}
async function espn(l){const d=state.date.replaceAll('-','');const x=await json(`https://site.api.espn.com/apis/site/v2/sports/${l.path}/scoreboard?dates=${d}`,l.name);if(!Array.isArray(x.events))throw Error(`${l.name}: 試合一覧がありません`);let ev=x.events;if(l.league==='MLB')ev=ev.filter(focusedMLB);state.sources.push(`${l.name} / ESPN：${ev.length}件`);return ev.map(e=>mapESPN(e,l))}
async function mlbBackup(l){const d=state.date.split('-').slice(1).concat(state.date.split('-')[0]).join('/');const x=await json(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${encodeURIComponent(d)}&hydrate=team`,'MLB公式 Stats API');const games=(x.dates||[]).flatMap(a=>a.games||[]).filter(g=>MLB_IDS.has(Number(g.teams?.home?.team?.id))||MLB_IDS.has(Number(g.teams?.away?.team?.id)));state.sources.push(`MLB公式 Stats API：${games.length}件`);return games.map(g=>{const h=g.teams?.home||{},a=g.teams?.away||{},s=g.status||{},st=status(s.detailedState,s.abstractGameState==='Live'?'in':s.abstractGameState==='Final'?'post':'pre');return{id:`mlb-${g.gamePk}`,eventId:String(g.gamePk),sport:'baseball',league:l.name,leagueId:'MLB',source:'MLB公式 Stats API',date:g.gameDate,home:{name:teamJA(h.team?.name,'MLB'),score:h.score??null},away:{name:teamJA(a.team?.name,'MLB'),score:a.score??null},status:{label:st[0],kind:st[1]},detailUrl:null}})}
function tsdbIs(e,l){const league=key(e.strLeague);if(l.league==='NPB'){const hay=key([e.strHomeTeam,e.strAwayTeam,e.strLeague].join(' '));return /npb|nipponprofessionalbaseball|japanprofessionalbaseball/.test(league)||NPB.filter(t=>t.some(n=>hay.includes(key(n)))).length>=2}return /bleague|japaneseb1|japanesebasketball|b1league|b2league|b3league/.test(league)}
function mapTSDB(e,l){const st=status(e.strStatus||e.strProgress);const date=e.strTimestamp?new Date(e.strTimestamp).toISOString():(e.strTime?`${e.dateEvent}T${e.strTime}Z`:e.dateEvent?`${e.dateEvent}T00:00:00Z`:null);return{id:`tsdb-${l.league}-${e.idEvent}`,eventId:e.idEvent,sport:l.sport,league:e.strLeague||l.name,leagueId:l.league,source:'TheSportsDB',date,timeUnknown:!e.strTimestamp&&!e.strTime,home:{name:teamJA(e.strHomeTeam,l.league),logo:e.strHomeTeamBadge,score:e.intHomeScore===''||e.intHomeScore==null?null:Number(e.intHomeScore)},away:{name:teamJA(e.strAwayTeam,l.league),logo:e.strAwayTeamBadge,score:e.intAwayScore===''||e.intAwayScore==null?null:Number(e.intAwayScore)},status:{label:st[0],kind:st[1]},detailUrl:null,externalUrl:e.idEvent?`https://www.thesportsdb.com/event/${e.idEvent}`:null}}
async function tsdb(l){const x=await json(`https://www.thesportsdb.com/api/v1/json/3/eventsday.php?d=${state.date}&s=${l.tsdb}`,l.name+' TheSportsDB');const ev=(x.events||[]).filter(e=>String(e.dateEvent||'')===state.date&&tsdbIs(e,l));state.sources.push(`${l.name} / TheSportsDB：${ev.length}件（収録範囲に依存）`);if(!ev.length)throw Error(`${l.name}：無料データ元で対象日の試合を確認できません。試合が存在しないという意味ではありません。`);return ev.map(e=>mapTSDB(e,l))}
async function fetchLeague(l){if(l.league==='MLB'){let err;try{const a=await espn(l);if(a.length)return a}catch(e){err=e}try{const b=await mlbBackup(l);if(b.length)return b;if(!err)return b;throw err}catch(e){throw Error(`MLBの取得失敗：${err?.message||''} ${e.message}`)}}return l.tsdb?tsdb(l):espn(l)}
async function load(){if(state.loading)return;state.loading=true;$('#matches').innerHTML='<div class="loading">実データを取得中…</div>';state.errors=[];state.sources=[];const ls=leagues.filter(l=>state.sport==='all'||l.sport===state.sport);const rs=await Promise.allSettled(ls.map(fetchLeague));let all=[];rs.forEach((r,i)=>r.status==='fulfilled'?all.push(...r.value):state.errors.push(`${ls[i].name}：${r.reason?.message||'取得失敗'}`));const map=new Map();for(const m of all){const k=[m.sport,m.date?.slice(0,10),key(m.away.name),key(m.home.name)].join('|');if(!map.has(k)||map.get(k).source!=='ESPN'&&m.source==='ESPN')map.set(k,m)}state.matches=[...map.values()].sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));state.last=new Date();state.loading=false;render()}
function list(){const q=$('#search').value.trim().toLowerCase();return state.matches.filter(m=>{if(state.filter==='live'&&m.status.kind!=='live')return false;if(state.filter==='pre'&&m.status.kind!=='pre')return false;if(state.filter==='post'&&m.status.kind!=='post')return false;if(state.filter==='fav'&&!favs.includes(m.id))return false;return !q||`${m.home.name} ${m.away.name} ${m.league}`.toLowerCase().includes(q)})}
function card(m){const f=favs.includes(m.id),meta=m.status.kind==='live'?[m.status.period?`第${m.status.period}${m.sport==='baseball'?'回':m.sport==='basketball'?'Q':''}`:'試合中',m.status.clock].filter(Boolean).join(' · '):m.status.kind==='pre'?time(m.date,m.timeUnknown):m.status.label;return `<article class="match" data-id="${esc(m.id)}"><div class="matchtop"><span class="league">${esc(m.league)} · ${esc(m.source)}</span><span class="status ${m.status.kind==='live'?'live':''}">${esc(m.status.label)}</span></div><div class="teams"><div class="team">${m.away.logo?`<img src="${esc(m.away.logo)}" alt="" onerror="this.remove()">`:''}${esc(m.away.name)}</div><div class="score">${esc(m.away.score??'—')} - ${esc(m.home.score??'—')}<small>${esc(meta)}</small></div><div class="team">${m.home.logo?`<img src="${esc(m.home.logo)}" alt="" onerror="this.remove()">`:''}${esc(m.home.name)}</div></div><div class="foot"><span>${esc(time(m.date,m.timeUnknown))} · 詳細を開く</span><button class="fav" data-fav="${esc(m.id)}">${f?'★':'☆'}</button></div></article>`}
function render(){const arr=list();$('#dateLabel').textContent=new Date(state.date+'T12:00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'})+' · 実データ';$('#updated').textContent=state.last?'更新 '+state.last.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'未更新';$('#count').textContent=`${arr.length} 試合`;$('#listTitle').textContent='試合一覧';if(arr.length)$('#matches').innerHTML=arr.map(card).join('');else if(state.errors.length&&!state.matches.length)$('#matches').innerHTML=`<div class="error"><b>試合データを取得できませんでした</b>${esc(state.errors.join(' / '))}${links()}</div>`;else $('#matches').innerHTML=`<div class="empty"><b>表示できる試合がありません</b>${state.matches.length?'検索・絞り込み条件を変えてください。':'データ提供元に対象日の試合が収録されていない可能性があります。'}${links()}</div>`;$('#warning').textContent=state.errors.length?`一部のデータ元で取得エラー：${state.errors.join(' / ')}`:'架空の試合・スコアは表示しません。無料データ元の収録範囲には限りがあります。'}
function links(){return `<div class="links">${official.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener noreferrer">${x[0]} ↗</a>`).join('')}</div>`}
async function detail(id){const m=state.matches.find(x=>x.id===id);if(!m)return;state.detail=m;state.tab='game';$('#modalTitle').textContent=`${m.away.name} vs ${m.home.name}`;$('#back').classList.add('show');$('#modalBody').innerHTML='<div class="loading">詳細データを確認中…</div>';if(m.source==='MLB公式 Stats API'&&m.eventId){try{m.summary={mlb:await json(`https://statsapi.mlb.com/api/v1.1/game/${m.eventId}/feed/live`,'MLB詳細')}}catch(e){m.detailError=e.message}}else if(m.detailUrl){try{m.summary=await json(m.detailUrl,'試合詳細')}catch(e){m.detailError=e.message}}drawDetail()}
function drawDetail(){const m=state.detail,d=m.summary||{},mlb=d.mlb||{},live=mlb.liveData||{},teams=d.header?.competitions?.[0]?.competitors||[],tabs=[['game','試合'],['events','経過'],['stats','スタッツ'],['lineup','出場選手'],['jplayers','日本人選手']];let text='';
if(state.tab==='game'){text=`${m.league} · ${m.status.label} · ${time(m.date,m.timeUnknown)}\nデータ取得元：${m.source}\n取得時刻：${new Date().toLocaleTimeString('ja-JP')}`;if(m.externalUrl)text+=`\n提供元イベント：${m.externalUrl}`;if(live.linescore?.innings?.length)text+='\n\nイニング別スコア\n'+live.linescore.innings.map((x,i)=>`${i+1}回：ビジター ${x.away?.runs??'—'} / ホーム ${x.home?.runs??'—'}`).join('\n')}
else if(state.tab==='events'){const plays=d.plays?.[0]?.plays||d.commentary||[],p=live.plays?.allPlays||[];text=plays.length?plays.slice(-35).reverse().map(x=>`${x.clock?.displayValue||x.period?.displayValue||''} ${x.text||x.shortText||''}`).join('\n'):p.length?p.slice(-35).reverse().map(x=>`${x.about?.inning?x.about.inning+'回':''} ${x.result?.description||x.result?.event||'プレー情報'}`).join('\n'):'この試合の経過データは提供されていません。'}
else if(state.tab==='stats'){const box=d.boxscore?.teams||[];if(box.length)text=box.map(t=>`${t.team?.displayName||'チーム'}\n${(t.statistics||[]).map(s=>`${s.label||s.name}: ${s.displayValue||s.value}`).join('\n')}`).join('\n\n');else if(live.boxscore?.teams)text=['away','home'].map(side=>{const t=live.boxscore.teams[side];return `${side==='away'?'ビジター':'ホーム'}\n${Object.entries(t.teamStats?.batting||{}).map(([k,v])=>`${k}: ${v}`).join('\n')}\n${Object.entries(t.teamStats?.pitching||{}).map(([k,v])=>`${k}: ${v}`).join('\n')}`}).join('\n\n');else text='スタッツは提供されていません。'}
else if(state.tab==='lineup'){const box=d.boxscore?.players||[];if(box.length)text=box.map(t=>`${t.team?.displayName||'チーム'}\n${(t.statistics||[]).flatMap(s=>s.athletes||[]).map(a=>a.athlete?.displayName).filter(Boolean).join('、')}`).join('\n\n');else if(live.boxscore?.teams)text=['away','home'].map(side=>`${side==='away'?'ビジター':'ホーム'}\n${Object.values(live.boxscore.teams[side].players||{}).map(p=>p.person?.fullName).filter(Boolean).join('、')}`).join('\n\n');else text='出場選手データは提供されていません。'}
else{const names=[];for(const t of d.boxscore?.players||[])for(const st of t.statistics||[])for(const a of st.athletes||[])if(JP_PLAYERS.some(n=>n.toLowerCase()===String(a.athlete?.displayName||'').toLowerCase()))names.push(a.athlete.displayName);if(live.boxscore?.teams)for(const side of ['away','home'])for(const p of Object.values(live.boxscore.teams[side].players||{}))if(JP_PLAYERS.some(n=>n.toLowerCase()===String(p.person?.fullName||'').toLowerCase()))names.push(p.person.fullName);text=names.length?[...new Set(names)].join('\n'):'取得した詳細データ内で登録済みの日本人選手名を確認できませんでした。出場していないことを意味するものではありません。'}
